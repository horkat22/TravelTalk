<!doctype html>
<html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#164e63"><link rel="manifest" href="manifest.webmanifest"><title>TravelTalk</title><link rel="stylesheet" href="style.css"></head>
<body><header><div class="brand">✈ TravelTalk</div><div class="sub">Angol és vietnámi – tanulj pár percet naponta</div></header>
<main><section class="controls"><label>Tanulni kívánt nyelv<select id="language"><option value="en">🇬🇧 Angol</option><option value="vi">🇻🇳 Vietnámi</option></select></label>
<label>Téma<select id="category"><option value="all">Minden téma</option></select></label></section>
<nav><button class="tab active" data-view="learn">Tanulás</button><button class="tab" data-view="quiz">Kvíz</button><button class="tab" data-view="list">Szólista</button></nav>
<section id="learn" class="panel"><div class="counter" id="counter"></div><div class="flashcard"><div class="hint">Magyarul</div><div id="prompt" class="prompt">Betöltés…</div><div id="answer" class="answer hidden"></div><button id="speakCard" class="soundbtn" type="button" aria-label="Kiejtés meghallgatása">🔊 Kiejtés meghallgatása</button><div class="actions"><button id="reveal" class="primary">Mutasd a fordítást</button><button id="next">Következő →</button></div><button id="favorite" class="textbtn">☆ Kedvencekhez</button></div></section>
<section id="quiz" class="panel hidden"><div class="quizbox"><div class="hint">Mit jelent magyarul?</div><div id="question" class="prompt"></div><div id="choices" class="choices"></div><div id="feedback" aria-live="polite"></div><button id="nextq" class="primary">Következő kérdés</button></div></section>
<section id="list" class="panel hidden"><input id="search" placeholder="Keresés magyarul vagy a tanult nyelven…"><div id="wordlist"></div></section>
<footer><span id="progress">Haladás</span><span>TravelTalk • bővített próba-verzió</span></footer></main><script src="app.js"></script></body></html>
